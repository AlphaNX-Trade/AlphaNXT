kind = "web"
previewPath = "/"
title = "AlphaNXT"
version = "1.0.0"
id = "artifacts/alphanxt"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25187

[services.development]
run = "pnpm --filter @workspace/alphanxt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alphanxt", "run", "build" ]
serve = "static"
publicDir = "artifacts/alphanxt/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25187"
BASE_PATH = "/"
